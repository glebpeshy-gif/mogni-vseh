<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 544 544" width="544" height="544">
<defs>
  <filter id="sticker" x="-10%" y="-10%" width="120%" height="125%">
