    <feGaussianBlur in="fat" stdDeviation="7" result="blur"/>
    <feOffset in="blur" dx="0" dy="9" result="drop"/>
    <feFlood flood-color="#12062b" flood-opacity="0.45"/><feComposite in2="drop" operator="in" result="shadow"/>
